name: Release

# Pushing a version tag (v0.1.0) checks the code, builds the package and attaches module.json and the zip to the
# GitHub release for that tag. The release is created here if it does not exist yet.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: No art or build output in the repository
        run: npm run check:art -- --all
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - name: The tag matches the module version
        run: |
          version="$(node -p "require('./module/module.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match module.json version $version" >&2
            exit 1
          fi
      - run: npm run package
      - name: Attach module.json and the zip to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/module.json dist/sargas-pf2e-formidable-forms.zip --clobber
